<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
        .box { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #2563eb; color: white; }
        .empty { color: #666; padding: 20px; text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <h2>Registered Students</h2>
    <a th:href="@{/student/register}">Register a student</a>

    <p class="empty" th:if="${#lists.isEmpty(students)}">No students registered yet.</p>

    <table th:unless="${#lists.isEmpty(students)}">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Age</th>
        </tr>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.firstName}"></td>
            <td th:text="${s.lastName}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.age}"></td>
        </tr>
    </table>
</div>
</body>
</html>
